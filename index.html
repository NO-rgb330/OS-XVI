<!-- ============================================================
     DESKTOP
     ============================================================ -->
<main id="desktop" aria-label="Desktop">
  <div id="desktop-icons" role="list"></div>
</main>

<!-- ============================================================
     WINDOWS LAYER — the WM mounts window elements here
     ============================================================ -->
<div id="window-layer"></div>

<!-- ============================================================
     TOP PANEL (XFCE-style)
     ============================================================ -->
<header id="panel" role="banner">
  <button id="apps-btn" class="panel-btn" type="button"
          title="Applications menu"
          aria-haspopup="menu" aria-expanded="false">
    <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    <span class="panel-btn-label">Applications</span>
  </button>
  <div id="tasklist" role="list" aria-label="Open windows"></div>
  <div id="panel-right">
    <div id="clock" class="panel-clock" title="Date and time" aria-live="off">--:--</div>
    <button id="session-btn" class="panel-btn panel-btn-icon" type="button" title="Lock Session">
      <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
    </button>
  </div>
</header>

<!-- Applications menu popup (populated by panel.js) -->
<div id="apps-menu" class="popup" role="menu" hidden>
  <div class="popup-title">Applications</div>
  <div id="apps-grid" class="apps-grid"></div>
</div>

<!-- Context menu (single node, repopulated per invocation) -->
<div id="context-menu" class="popup context-menu" role="menu" hidden></div>

<!-- Dialog layer (modal stack) -->
<div id="dialog-layer" class="dialog-layer" hidden></div>

<!-- Toast layer -->
<div id="toast-layer" class="toast-layer" role="status" aria-live="polite"></div>

<!-- Boot splash -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-inner">
    <svg class="icon splash-icon"><use href="#i-desktop"/></svg>
    <div class="splash-title">Monochrome Desktop</div>
    <div class="splash-status" id="splash-status">Starting…</div>
  </div>
</div>

<noscript>
  <div class="noscript">This desktop requires JavaScript.</div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
